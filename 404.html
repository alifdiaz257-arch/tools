<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 · Not Found</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#1f2328;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  Helvetica,Arial,sans-serif;
}

.container{
  width:90%;
  max-width:900px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:70px;
  padding:30px;
}

.illustration{
  width:220px;
  height:220px;
  position:relative;
}

.head{
  position:absolute;
  width:150px;
  height:150px;
  border:4px solid #1f2328;
  border-radius:50%;
  left:35px;
  top:15px;
}

.eye{
  position:absolute;
  width:16px;
  height:16px;
  background:#1f2328;
  border-radius:50%;
  top:65px;
}

.eye.left{
  left:35px;
}

.eye.right{
  right:35px;
}

.mouth{
  position:absolute;
  width:50px;
  height:22px;
  border-bottom:4px solid #1f2328;
  border-radius:50%;
  left:47px;
  top:90px;
}

.body{
  position:absolute;
  width:95px;
  height:45px;
  border:4px solid #1f2328;
  border-bottom:0;
  border-radius:60px 60px 0 0;
  left:62px;
  top:165px;
}

.text{
  max-width:430px;
}

h1{
  margin:0 0 12px;
  font-size:32px;
  font-weight:600;
}

p{
  margin:0 0 24px;
  color:#656d76;
  font-size:16px;
  line-height:1.6;
}

a{
  display:inline-block;
  padding:8px 16px;
  border-radius:6px;
  background:#1f883d;
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

a:hover{
  background:#1a7f37;
}

@media(max-width:650px){
  .container{
    flex-direction:column;
    gap:25px;
    text-align:center;
  }

  .illustration{
    transform:scale(.85);
  }

  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="illustration">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
    <div class="body"></div>
  </div>

  <div class="text">
    <h1>404: Not Found</h1>

    <p>
      The page you are looking for could not be found.
      It may have been moved, deleted, or never existed.
    </p>

    <a href="/">Go back home</a>
  </div>

</main>

</body>
</html>
