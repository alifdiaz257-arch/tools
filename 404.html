<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>404 • Halaman Tidak Ditemukan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #06080f;
            --bg-card: rgba(18, 22, 36, 0.75);
            --border-light: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(139, 92, 246, 0.15);
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --secondary: #06b6d4;
            --accent: #f472b6;
            --text-main: #f1f3f5;
            --text-muted: #8892a0;
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-blur: blur(16px);
            --success: #4ade80;
            --danger: #ef4444;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            font-weight: 500;
            overflow-x: hidden;
            min-height: 100vh;
            padding-top: 80px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(6, 182, 212, 0.03) 0%, transparent 60%),
                linear-gradient(180deg, #06080f 0%, #0c0e1a 50%, #06080f 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.06); border-radius: 10px; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.06) transparent; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            animation: fadeUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            padding: 10px 20px;
            background: rgba(10, 12, 20, 0.6);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            border-radius: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .brand span { color: var(--primary); }
        .brand i { color: var(--primary); }

        .error-icon {
            font-size: 6rem;
            color: var(--primary);
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
            display: block;
        }
        .error-icon i {
            filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.15));
        }

        .error-number {
            font-family: var(--font-head);
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -8px;
            margin-bottom: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        .error-title {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto 24px;
            opacity: 0.5;
            font-weight: 400;
        }

        .search-wrapper {
            width: 100%;
            max-width: 460px;
            margin: 0 auto 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 4px 4px 4px 16px;
            transition: all 0.25s ease;
        }

        .search-bar:hover {
            border-color: var(--border-hover);
        }

        .search-bar:focus-within {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.04);
        }

        .search-bar .icon {
            color: var(--text-muted);
            opacity: 0.3;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            outline: none;
            padding: 10px 0;
            min-width: 0;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            opacity: 0.2;
            font-weight: 400;
        }

        .search-bar .search-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(145deg, #7c3aed, #6d28d9);
            color: #fff;
            font-family: inherit;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-bar .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
        }

        .search-bar .search-btn:active {
            transform: scale(0.95);
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 24px;
        }

        .suggestions .suggest-link {
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 0.7rem;
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .suggestions .suggest-link:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .suggestions .suggest-link i {
            margin-right: 4px;
            font-size: 0.6rem;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(145deg, #7c3aed, #6d28d9);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            transform: translateY(-3px);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.6rem;
            opacity: 0.15;
            font-weight: 400;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .toast-notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 12, 28, 0.95);
            border: 1px solid var(--border-light);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-main);
            z-index: 99999;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-weight: 600;
            max-width: 90%;
            text-align: center;
            animation: toastIn 0.3s ease;
        }

        @media (max-width: 700px) {
            body { padding-top: 70px; }
            .error-number { font-size: 5rem; letter-spacing: -4px; }
            .error-icon { font-size: 4rem; }
            .error-title { font-size: 1.3rem; }
            .error-desc { font-size: 0.85rem; }
            .search-bar input { font-size: 0.8rem; padding: 8px 0; }
            .search-bar .search-btn { font-size: 0.6rem; padding: 6px 12px; }
            .btn { padding: 10px 20px; font-size: 0.75rem; }
            .suggestions .suggest-link { font-size: 0.6rem; padding: 4px 10px; }
            nav { width: 96%; padding: 8px 14px; top: 10px; }
            .brand { font-size: 0.85rem; }
        }

        @media (max-width: 400px) {
            .error-number { font-size: 4rem; letter-spacing: -2px; }
            .error-icon { font-size: 3rem; }
            .error-title { font-size: 1.1rem; }
            .buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; justify-content: center; }
            .search-bar { flex-wrap: wrap; padding: 4px; }
            .search-bar input { min-width: 100%; padding: 8px 12px; }
            .search-bar .search-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">
            <i class="fas fa-code"></i> Scrape<span>Website</span>
        </a>
    </nav>

    <div class="container">
        <span class="error-icon"><i class="fas fa-compass"></i></span>
        <div class="error-number">404</div>
        <h1 class="error-title">Halaman Tidak Ditemukan</h1>
        <p class="error-desc">
            Maaf, halaman yang Anda cari tidak dapat ditemukan.
            Mungkin URL salah atau halaman sudah dipindahkan.
        </p>

        <div class="search-wrapper">
            <div class="search-bar">
                <span class="icon"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" placeholder="Cari halaman..." autofocus />
                <button class="search-btn" id="searchBtn"><i class="fas fa-arrow-right"></i> Cari</button>
            </div>
        </div>


        <div class="buttons">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
            

    </div>

    <script>
        (function() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            const pages = [
                { name: 'Beranda', url: 'index.html', keywords: ['home', 'utama', 'beranda'] },
                { name: 'Scraper', url: 'scraper.html', keywords: ['scrape', 'scraping', 'download', 'website'] },
                { name: 'Dashboard', url: 'dashboard.html', keywords: ['aktivitas', 'history', 'statistik'] },
                { name: 'IQC Studio', url: 'iqc.html', keywords: ['iqc', 'generate', 'gambar', 'teks'] },
                { name: 'Admin', url: 'admin.html', keywords: ['admin', 'panel', 'settings'] },
            ];

            function searchPage(query) {
                const q = query.toLowerCase().trim();
                if (!q) return null;
                for (const page of pages) {
                    if (page.name.toLowerCase().includes(q)) return page.url;
                    for (const kw of page.keywords) {
                        if (kw.includes(q) || q.includes(kw)) return page.url;
                    }
                }
                return null;
            }

            function handleSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.style.borderColor = '#ef4444';
                    setTimeout(() => { searchInput.style.borderColor = ''; }, 1500);
                    return;
                }
                const result = searchPage(query);
                if (result) {
                    window.location.href = result;
                } else {
                    showToast('🔍 Halaman "' + query + '" tidak ditemukan');
                    searchInput.style.borderColor = '#ef4444';
                    setTimeout(() => { searchInput.style.borderColor = ''; }, 2000);
                }
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault();
                    handleSearch(); }
            });

            document.getElementById('reportBtn').addEventListener('click', function(e) {
                e.preventDefault();
                showToast('📨 Laporan dikirim! Terima kasih.');
            });

            function showToast(msg) {
                const existing = document.querySelector('.toast-notif');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notif';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(20px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            setTimeout(() => searchInput.focus(), 500);
            console.log('🔍 404 Page — Siap!');
        })();
    </script>

</body>
</html>
