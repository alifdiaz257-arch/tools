    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; }
        :root {
            --bg-deep: #06080f; --bg-card: rgba(18,22,36,0.75); --border-light: rgba(255,255,255,0.05);
            --primary: #8b5cf6; --secondary: #06b6d4; --accent: #f472b6;
            --text-main: #f1f3f5; --text-muted: #8892a0;
            --font-head: 'Space Grotesk', sans-serif; --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-blur: blur(16px); --success: #4ade80; --danger: #ef4444;
        }
        body {
            background: var(--bg-deep); color: var(--text-main); font-family: var(--font-body);
            font-weight: 500; overflow-x: hidden; min-height: 100vh; padding-top: 80px;
            display: flex; align-items: center; justify-content: center; padding: 80px 20px 40px;
            position: relative;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(to bottom, #06080f 0%, #06080f 40%, rgba(6,8,15,0) 100%),
                linear-gradient(to right, #0ed2da, #5f29c7);
            opacity: 0.15; pointer-events: none;
        }
        body::after {
            content: ""; position: fixed; inset: 0; z-index: 0;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 100%; pointer-events: none;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 10px; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent; }

        .container-wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; }

        .container {
            width: 100%; background: rgba(18,22,36,0.75); backdrop-filter: var(--glass-blur);
            border-radius: 28px; padding: 28px 24px 24px;
            border: 1px solid var(--border-light); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: containerIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0; transform: translateY(40px) scale(0.98);
        }
        @keyframes containerIn { 0% { opacity:0; transform:translateY(40px) scale(0.98); } 100% { opacity:1; transform:translateY(0) scale(1); } }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
            animation: fadeSlide 0.6s ease 0.15s forwards;
            opacity: 0; transform: translateY(10px);
        }
        @keyframes fadeSlide { to { opacity:1; transform:translateY(0); } }

        .header-left .title {
            font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;
            color: #fff; background: linear-gradient(135deg, #fff 60%, rgba(255,255,255,0.5));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-left .title span { background: linear-gradient(135deg, #8b5cf6, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-left .version { font-size: 0.65rem; color: rgba(255,255,255,0.15); letter-spacing: 2px; font-weight: 400; margin-top: 1px; }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .badge-ready {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 14px; border-radius: 100px;
            background: rgba(74,222,128,0.06);
            border: 1px solid rgba(74,222,128,0.1);
            font-size: 0.6rem; font-weight: 600;
            color: #4ade80; letter-spacing: 0.8px; text-transform: uppercase;
            animation: pulseBadge 2s ease-in-out infinite;
        }
        .badge-ready .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: dotPulse 1.6s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.7); } }
        @keyframes pulseBadge { 0%,100% { border-color: rgba(74,222,128,0.1); } 50% { border-color: rgba(74,222,128,0.25); } }

        .form-group { margin-bottom: 16px; animation: fadeSlide 0.6s ease forwards; opacity:0; transform:translateY(10px); }
        .form-group:nth-child(1) { animation-delay: 0.2s; }

        .form-label {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; color: rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }
        .form-label svg { width: 14px; height: 14px; stroke: rgba(255,255,255,0.15); }

        .form-input {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px; color: #fff;
            font-size: 0.95rem; font-family: inherit;
            transition: all 0.3s ease; outline: none; font-weight: 500;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.08); font-weight: 400; }
        .form-input:focus { border-color: rgba(139,92,246,0.2); background: rgba(255,255,255,0.04); box-shadow: 0 0 0 4px rgba(139,92,246,0.03); }

        .time-display {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04); border-radius: 12px;
            font-size: 0.9rem; color: rgba(255,255,255,0.4);
            margin-bottom: 16px;
            animation: fadeSlide 0.6s ease 0.25s forwards;
            opacity:0; transform:translateY(10px);
        }
        .time-display svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.15); }
        .time-display .time-value { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

        .btn-generate {
            width: 100%; padding: 15px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff;
            font-size: 0.95rem; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            letter-spacing: 0.5px; margin-top: 4px; margin-bottom: 20px;
            position: relative; overflow: hidden;
            animation: fadeSlide 0.6s ease 0.35s forwards;
            opacity:0; transform:translateY(10px);
        }
        .btn-generate::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.05) 60%, transparent 80%);
            transform: translateX(-100%); transition: transform 0.6s ease;
        }
        .btn-generate:hover::before { transform: translateX(100%); }
        .btn-generate:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(124,58,237,0.25); }
        .btn-generate:active { transform: scale(0.97); }
        .btn-generate svg { width: 18px; height: 18px; stroke: currentColor; }

        .error-msg {
            display: none; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 12px;
            background: rgba(239,68,68,0.04);
            border: 1px solid rgba(239,68,68,0.08);
            color: #f87171; font-size: 0.8rem;
            margin-bottom: 16px; animation: shake 0.4s ease;
        }
        .error-msg.active { display: flex; }
        .error-msg svg { width: 16px; height: 16px; stroke: currentColor; opacity: 0.6; }
        @keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-8px); } 40% { transform:translateX(8px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(4px); } }

        .result {
            display: none; margin-top: 4px;
            animation: resultIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .result.active { display: block; }
        @keyframes resultIn { 0% { opacity:0; transform:translateY(20px) scale(0.97); } 100% { opacity:1; transform:translateY(0) scale(1); } }

        .result-image {
            width: 100%; border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4); margin-bottom: 16px;
            transition: box-shadow 0.4s ease;
        }
        .result-image:hover { box-shadow: 0 16px 56px rgba(0,0,0,0.6); }
        .result-image img { width: 100%; display: block; animation: imgReveal 0.8s ease forwards; }
        @keyframes imgReveal { 0% { opacity:0; transform:scale(0.98); } 100% { opacity:1; transform:scale(1); } }

        .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result-actions .btn-action {
            padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            background: rgba(255,255,255,0.02); color: #fff;
            font-size: 0.85rem; font-weight: 500; font-family: inherit;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .result-actions .btn-action:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .result-actions .btn-action:active { transform: scale(0.96); }
        .result-actions .btn-action svg { width: 16px; height: 16px; stroke: currentColor; opacity: 0.5; }

        .footer { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.02); display: flex; justify-content: center; gap: 16px; align-items: center; animation: fadeSlide 0.6s ease 0.5s forwards; opacity:0; transform:translateY(10px); }
        .footer .credit { font-size: 0.65rem; color: rgba(255,255,255,0.08); letter-spacing: 1.5px; }
        .footer .credit strong { color: rgba(255,255,255,0.15); font-weight: 500; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; transition: 0.25s ease; }
        .back-btn:hover { color: #fff; }

        .loading-overlay {
            position: fixed; inset: 0; background: rgba(6,6,15,0.95); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            z-index: 999; opacity: 0; visibility: hidden; transition: all 0.5s ease;
        }
        .loading-overlay.active { opacity: 1; visibility: visible; }
        .loading-overlay .loader-spinner { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(139,92,246,0.1); border-top-color: var(--primary); animation: spin 1s linear infinite; }
        .loading-overlay .load-text { color: rgba(255,255,255,0.2); font-size: 0.7rem; letter-spacing: 4px; font-weight: 400; text-transform: uppercase; animation: loadPulse 1.6s ease-in-out infinite; }
        @keyframes loadPulse { 0%,100% { opacity:0.3; } 50% { opacity:0.8; } }
        @keyframes spin { to { transform:rotate(360deg); } }

        .notif {
            position: fixed; top: 24px; right: 24px; max-width: 320px;
            padding: 14px 20px; background: rgba(14,14,22,0.94);
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px; color: #fff; display: flex; align-items: center; gap: 14px;
            z-index: 1000; transform: translateX(120%);
            transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .notif.show { transform: translateX(0); }
        .notif .notif-icon svg { width: 24px; height: 24px; stroke: #4ade80; animation: notifPop 0.5s ease; }
        @keyframes notifPop { 0% { transform:scale(0); } 70% { transform:scale(1.2); } 100% { transform:scale(1); } }
        .notif .notif-content h4 { font-size: 0.85rem; font-weight: 600; }
        .notif .notif-content p { font-size: 0.7rem; color: rgba(255,255,255,0.3); }

        @media (max-width: 480px) {
            body { padding: 70px 12px 30px; }
            .container { padding: 20px 16px; border-radius: 20px; }
            .header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .header-left .title { font-size: 1.4rem; }
            .header-right { flex-wrap: wrap; }
            .badge-ready { font-size: 0.55rem; padding: 4px 12px; }
            .result-actions { grid-template-columns: 1fr; }
            .notif { right: 12px; left: 12px; max-width: none; }
            .form-input { font-size: 0.9rem; padding: 12px 14px; }
            .btn-generate { padding: 13px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container-wrapper">
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <div class="title">IQC<span>Studio</span></div>
                    <div class="version">v3.0 · mobile</div>
                </div>
                <div class="header-right">
                    <div class="badge-ready"><span class="dot"></span> Ready</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Pesan
                </label>
                <input type="text" id="textInput" class="form-input" placeholder="Ketik pesan..." autofocus>
            </div>

            <div class="time-display">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Waktu sekarang:</span>
                <span class="time-value" id="currentTime">--:--</span>
            </div>

            <div class="error-msg" id="errorMsg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="errorText">Terjadi kesalahan.</span>
            </div>

            <button class="btn-generate" id="generateBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Generate
            </button>

            <div class="result" id="resultSection">
                <div class="result-image"><img id="resultImg" src="" alt="Generated"></div>
                <div class="result-actions">
                    <button class="btn-action" id="downloadBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download
                    </button>
                    <button class="btn-action" id="newBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Baru
                    </button>
                </div>
            </div>

            <div class="footer">
                <div class="credit">DEV BY <strong>lifxXd</strong></div>
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-spinner"></div>
        <p class="load-text">Generating</p>
    </div>

    <div class="notif" id="notification">
        <div class="notif-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="notif-content"><h4>Berhasil!</h4><p>Gambar siap diunduh</p></div>
    </div>

    <script>
    (function() {
        // DOM ELEMENTS
        const generateBtn = document.getElementById('generateBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultSection = document.getElementById('resultSection');
        const resultImg = document.getElementById('resultImg');
        const downloadBtn = document.getElementById('downloadBtn');
        const newBtn = document.getElementById('newBtn');
        const textInput = document.getElementById('textInput');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const notification = document.getElementById('notification');
        const currentTimeEl = document.getElementById('currentTime');

        let currentImageUrl = '';

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            currentTimeEl.textContent = hours + ':' + minutes;
        }
        updateTime();
        setInterval(updateTime, 10000);

        function showNotif() {
            notification.classList.add('show');
            clearTimeout(window._notifTimer);
            window._notifTimer = setTimeout(() => notification.classList.remove('show'), 4000);
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('active');
            clearTimeout(window._errTimer);
            window._errTimer = setTimeout(() => errorMsg.classList.remove('active'), 5000);
        }

        generateBtn.addEventListener('click', async function() {
            const text = textInput.value.trim();
            if (!text) { showError('Isi pesan terlebih dahulu.'); return; }

            loadingOverlay.classList.add('active');
            errorMsg.classList.remove('active');

            try {
                const url = 'https://api.azbry.com/api/maker/iqc?text=' + encodeURIComponent(text);
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);
                const res = await fetch(url, { signal: controller.signal, mode: 'cors' });
                clearTimeout(timeout);

                if (!res.ok) throw new Error('API error: ' + res.status);
                const ct = res.headers.get('content-type');
                if (!ct || !ct.includes('image')) throw new Error('API tidak mengembalikan gambar');

                const blob = await res.blob();
                if (blob.size === 0) throw new Error('Gambar kosong');

                if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = URL.createObjectURL(blob);
                resultImg.src = currentImageUrl;

                await new Promise((resolve, reject) => {
                    resultImg.onload = resolve;
                    resultImg.onerror = () => reject(new Error('Gagal memuat gambar'));
                });

                loadingOverlay.classList.remove('active');
                resultSection.classList.add('active');
                showNotif();

                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (err) {
                console.error(err);
                loadingOverlay.classList.remove('active');
                if (err.name === 'AbortError') showError('Waktu habis. Coba lagi.');
                else showError(err.message || 'Gagal generate.');
            }
        });

        downloadBtn.addEventListener('click', function() {
            if (!currentImageUrl) { showError('Tidak ada gambar.'); return; }
            const link = document.createElement('a');
            link.href = currentImageUrl;
            link.download = 'iqc-' + Date.now() + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        newBtn.addEventListener('click', function() {
            resultSection.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !loadingOverlay.classList.contains('active')) {
                generateBtn.click();
            }
        });

        window.addEventListener('load', () => { window.scrollTo(0, 0); });
    })();
    </script>
</body>
</html>
